name: Validate VazhaiGuardAI

on:
  push:
    branches:
      - prototype-commit13-cdse-farm-layers
      - fix/satellite-auto-acquisition-coordinates
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install boto3 fastapi pydantic requests python-dotenv pytest
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        working-directory: backend
